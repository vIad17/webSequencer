server {
    listen 5174;
    server_name websequencer.kykit.ru;

    root /usr/share/nginx/html;
    index index.html;

    # Ассеты — только реальные файлы, без SPA-fallback
    location /webSequencer/assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA-fallback для всех остальных путей под /webSequencer/
    location /webSequencer/ {
        try_files $uri $uri/ /webSequencer/index.html;
    }
}
