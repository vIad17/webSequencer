name: NEW Deploy

on:
  push:
    branches:
      - 'feature/deploy'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  deploy:
    runs-on: ubuntu-latest
    needs: build

    env:
      SSH_HOST: ${{ secrets.HOST }}
      SSH_PORT: ${{ secrets.PORT }}
      SSH_USER: ${{ secrets.USERNAME }}
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Get remote home path
        id: remote
        run: |
          REMOTE_HOME=$(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'echo $HOME')
          echo "deploy_path=$REMOTE_HOME/$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy files
        env:
          DEPLOY_PATH: ${{ steps.remote.outputs.deploy_path }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete -e "ssh -p $SSH_PORT" dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
